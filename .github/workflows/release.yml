name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify integration credentials
        if: ${{ secrets.PASTRY_DEV_KEY == '' || secrets.PASTRY_USERNAME == '' || secrets.PASTRY_PASSWORD == '' }}
        run: |
          echo "::error::Missing PASTRY_DEV_KEY/PASTRY_USERNAME/PASTRY_PASSWORD secrets required for release gating"
          exit 1
      - name: Run integration tests
        env:
          PASTRY_DEV_KEY: ${{ secrets.PASTRY_DEV_KEY }}
          PASTRY_USERNAME: ${{ secrets.PASTRY_USERNAME }}
          PASTRY_PASSWORD: ${{ secrets.PASTRY_PASSWORD }}
        run: go test -run Integration -v ./cli/

  goreleaser:
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
